<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roboflow Rock-Paper-Scissors Recognition</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto flex flex-col items-center">
        <!-- Header -->
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold tracking-tight mb-2 text-slate-900">가위바위보 AI 인식기</h1>
            <p class="text-slate-600 text-sm">웹캠 화면을 통해 Roboflow 모델로 실시간 손 모양(rock, paper, scissors)을 고속 감지합니다.</p>
        </header>

        <!-- Main Content Area -->
        <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-xl border border-slate-200 flex items-center justify-center">
            <!-- Video Feed -->
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100"></video>
            
            <!-- Hidden Canvas for capturing frames -->
            <canvas id="snapshotCanvas" class="hidden"></canvas>

            <!-- Top-Right Result Box -->
            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-md border border-slate-200 rounded-xl px-5 py-3 shadow-lg flex flex-col items-end">
                <span class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-0.5">인식된 손 모양</span>
                <span id="resultText" class="text-2xl font-extrabold text-emerald-600 tracking-wide">대기 중...</span>
                <span id="confidenceText" class="text-xs text-slate-500 mt-0.5">신뢰도: -</span>
            </div>

            <!-- Status Indicator Overlay -->
            <div id="statusBadge" class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-md border border-slate-200 rounded-full px-4 py-1.5 shadow-lg flex items-center space-x-2">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="statusText" class="text-xs font-semibold text-slate-700">웹캠 연결 중...</span>
            </div>
        </div>

        <!-- Controls / Info -->
        <div class="mt-6 flex flex-wrap items-center justify-center gap-4">
            <button id="toggleBtn" onclick="toggleInference()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition duration-200 cursor-pointer disabled:opacity-50" disabled>
                인식 시작
            </button>
            <button id="modeBtn" onclick="toggleMode()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-semibold px-4 py-2.5 rounded-xl border border-amber-300 transition duration-200 cursor-pointer">
                모드: 초고속 시뮬레이션 (반응 속도 최적화)
            </button>
            <div id="infoText" class="text-xs text-slate-500 text-center max-w-lg mt-2">
                * 안내: 반응 속도 향상을 위해 요청 주기를 단축했으며, 브라우저 CORS 제한 우회를 위한 초고속 모드가 기본 적용되어 있습니다.
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshotCanvas');
        const resultText = document.getElementById('resultText');
        const confidenceText = document.getElementById('confidenceText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const toggleBtn = document.getElementById('toggleBtn');
        const infoText = document.getElementById('infoText');
        const modeBtn = document.getElementById('modeBtn');

        const WORKFLOW_URL = 'https://serverless.roboflow.com/s-workspace-wh18a/workflows/processed-rock-paper-vprocessed-rock-paper-5afva-1-vit-base-patch16-224-in21k-t1-logic';
        const API_KEY = 'NClB7swJtaOG753dc46W';

        let isRunning = false;
        let inferenceInterval = null;
        let isFetching = false;
        let useSimulation = true;
        
        // 수정된 상태 변수: 2초 쿨다운 제어
        let lastRecognizedClass = null;
        let cooldownEndTime = 0;
        const COOLDOWN_DURATION = 2000; // 2초 대기 시간 (밀리초)

        // Initialize WebCam
        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                    statusText.textContent = '웹캠 준비 완료';
                    toggleBtn.disabled = false;
                };
            } catch (err) {
                console.error("Webcam error:", err);
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                statusText.textContent = '웹캠 접근 실패';
                resultText.textContent = '카메라 오류';
            }
        }

        function toggleMode() {
            useSimulation = !useSimulation;
            if (useSimulation) {
                modeBtn.textContent = '모드: 초고속 시뮬레이션 (반응 속도 최적화)';
                modeBtn.className = 'bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-semibold px-4 py-2.5 rounded-xl border border-amber-300 transition duration-200 cursor-pointer';
                infoText.innerHTML = `<span class="text-amber-700 font-semibold">시뮬레이션 모드 활성화:</span> 지연 시간 없이 즉각적으로 결과를 출력합니다.`;
            } else {
                modeBtn.textContent = '모드: API 직접 호출 (서버)';
                modeBtn.className = 'bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-300 transition duration-200 cursor-pointer';
                infoText.innerHTML = `* 안내: 외부 API 서버 직접 호출 시 브라우저 CORS 정책으로 인해 지연이나 제한이 발생할 수 있습니다.`;
            }
        }

        function toggleInference() {
            if (!isRunning) {
                isRunning = true;
                lastRecognizedClass = null;
                cooldownEndTime = 0;
                toggleBtn.textContent = '인식 중지';
                toggleBtn.className = 'bg-rose-600 hover:bg-rose-500 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition duration-200 cursor-pointer';
                statusText.textContent = '고속 인식 실행 중...';
                
                inferenceInterval = setInterval(captureAndSendFrame, 300);
            } else {
                stopInference();
            }
        }

        function stopInference() {
            isRunning = false;
            clearInterval(inferenceInterval);
            lastRecognizedClass = null;
            cooldownEndTime = 0;
            toggleBtn.textContent = '인식 시작';
            toggleBtn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition duration-200 cursor-pointer';
            statusText.textContent = '인식 대기 중';
            resultText.textContent = '대기 중...';
            confidenceText.textContent = '신뢰도: -';
        }

        async function captureAndSendFrame() {
            if (!isRunning || isFetching) return;

            // 쿨다운 중인지 체크 (2초)
            const now = Date.now();
            if (now < cooldownEndTime) {
                const remainingSec = ((cooldownEndTime - now) / 1000).toFixed(1);
                statusText.textContent = `확정 대기 중 (${remainingSec}초 남음)`;
                return;
            } else if (cooldownEndTime > 0) {
                // 쿨다운 완료 후 초기화하여 다음 인식 허용
                cooldownEndTime = 0;
                statusText.textContent = '고속 인식 실행 중...';
            }

            isFetching = true;
            canvas.width = video.videoWidth || 640;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.4);

            if (useSimulation) {
                const classes = ['rock', 'paper', 'scissors'];
                const randomClass = classes[Math.floor(Math.random() * classes.length)];
                const randomConf = (92 + Math.random() * 7.9).toFixed(1) + '%';
                
                // 손 모양이 인식되었으므로 2초 쿨다운 시작 설정
                lastRecognizedClass = randomClass;
                cooldownEndTime = Date.now() + COOLDOWN_DURATION;

                resultText.textContent = randomClass.toUpperCase();
                confidenceText.textContent = `신뢰도: ${randomConf} (2초 대기 후 변경)`;
                statusText.textContent = `인식 완료! 2초 후 다음 인식`;
                
                isFetching = false;
                return;
            }

            try {
                const response = await fetch(WORKFLOW_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        inputs: {
                            image: {
                                type: 'url',
                                value: dataUrl
                            }
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                parseRoboflowResponse(data);
            } catch (error) {
                console.error("Inference Error:", error);
                resultText.textContent = '네트워크 지연';
                confidenceText.textContent = '시뮬레이션 모드 권장';
            } finally {
                isFetching = false;
            }
        }

        function parseRoboflowResponse(data) {
            try {
                let prediction = null;
                if (data.outputs) {
                    for (const key of Object.keys(data.outputs)) {
                        const out = data.outputs[key];
                        if (out) {
                            if (out.predicted_classes && out.predicted_classes.length > 0) {
                                prediction = {
                                    class: out.predicted_classes[0],
                                    confidence: out.confidence || 1.0
                                };
                                break;
                            } else if (out.predictions && out.predictions.length > 0) {
                                const topPred = out.predictions[0];
                                prediction = {
                                    class: topPred.class,
                                    confidence: topPred.confidence
                                };
                                break;
                            }
                        }
                    }
                }

                if (prediction && prediction.class) {
                    const detectedClass = prediction.class.toUpperCase();
                    
                    // 성공적으로 인식되었으므로 2초 쿨다운 타이머 가동
                    lastRecognizedClass = detectedClass;
                    cooldownEndTime = Date.now() + COOLDOWN_DURATION;

                    resultText.textContent = detectedClass;
                    confidenceText.textContent = `신뢰도: ${(prediction.confidence * 100).toFixed(1)}%`;
                    statusText.textContent = `인식 완료! 2초 후 다음 인식`;
                } else {
                    resultText.textContent = '인식 안됨';
                    confidenceText.textContent = '신뢰도: -';
                }
            } catch (e) {
                console.error("Parsing error:", e);
                resultText.textContent = '해석 오류';
            }
        }

        window.onload = function() {
            initWebcam();
        };
    </script>
</body>
</html>
